<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment DANA - Scano Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .payment-container {
            background: rgba(26, 26, 26, 0.95);
            border: 2px solid #ffffff;
            border-radius: 20px;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.3);
            text-align: center;
        }
        .owl-art {
            font-size: 3rem;
            margin-bottom: 1rem;
            line-height: 1.4;
            white-space: pre;
            font-family: monospace;
        }
        .title {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .subtitle {
            font-size: 1.2rem;
            color: #cccccc;
            margin-bottom: 2rem;
        }
        .info-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            text-align: left;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1rem 0;
            font-size: 1.1rem;
        }
        .info-item::before {
            content: '😊';
            font-size: 1.3rem;
        }
        .highlight {
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }
        .back-btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #ffffff;
            color: #0a0a0a;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 2rem;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            box-shadow: 0 0 20px #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="owl-art">    ,_,
  (⦿▾⦿)
  (    )~乀
  し し</div>
        <div class="title">⊹ ♡ payment ˚ ₊ *</div>
        <div class="subtitle">by scano ᯤ ໑</div>
        
        <div style="font-size: 2rem; margin: 1rem 0;">hoo–hoo 😊 ʚ🦉ɞ</div>
        <div style="font-size: 1.5rem; margin: 1rem 0;">₍ ✿ ◠ ⑅ ◠ ₎ ⊹ DANA 💳</div>
        
        <div class="info-box">
            <div class="info-item">
                <span>ᥴ⃘ᦱ˙ 𝆕 a/n : <span class="highlight">AckerlySsmjt</span></span>
            </div>
            <div class="info-item">
                <span>ᥴ⃘ᦱ˙ 𝆕 numb : <span class="highlight">081271242937</span></span>
            </div>
            <div class="info-item">
                <span>ᥴ⃘ᦱ˙ 𝆕 dana → dana : <span class="highlight">100p</span></span>
            </div>
            <div class="info-item">
                <span>ᥴ⃘ᦱ˙ 𝆕 luar dana → dana : <span class="highlight">fee 1k</span></span>
            </div>
        </div>
        
        <a href="javascript:window.close()" class="back-btn">KEMBALI</a>
    </div>
</body>
</html>
